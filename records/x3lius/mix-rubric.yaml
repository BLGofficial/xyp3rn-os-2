# X3LIUS mix/master rubric: operator-authored first-party data (Phase 11, ARCHITECTURE F24). One canonical
# row in the x3lius-mix-master module; x3lius-mix-master checks every trace.analysis/v1 against it.
# Admit (then embed):
#   pnpm ingest --file records/x3lius/mix-rubric.yaml --origin first_party
# A change here + re-admission = a new version in knowledge_versions.
#
# Keys are trace.analysis/v1 metric ids (tech/trace/analysis.ts, TRACE_METRICS). Each bound is min, max or both,
# in the metric's unit. A metric not listed is reported as "unset", never checked against a default.
# Admission refuses REQUIRED: replace each one with your value, or delete the line.
mix_rubric: xyp-mix-rubric/v1
artist: X3LIUS
date: 2026-09-24
module: x3lius-mix-master
master:
  loudness.integrated-lufs: { min: -9.5, max: -7.5 }   # LUFS — loud dark-trap master, competitive club level
  loudness.true-peak-dbtp: { max: -1.0 }               # dBTP ceiling — standard streaming-safe limit
  loudness.range-lu: { min: 3.0 }                      # LU — narrow, heavily-limited trap dynamics
  dynamics.crest-factor-db: { min: 6.0 }               # dB — floor to catch over-limiting/pumping
  stereo.correlation: { min: 0.15 }                    # -1..1 — avoid phase cancellation on mono playback
  stereo.sub.width-pct: { max: 10 }                    # % — sub effectively mono, near-full collapse
  tonal.sub-db: { min: -3.0, max: 3.0 }                # dB rel. full band — sub sits near reference, no boom/thin
mix:
  loudness.true-peak-dbtp: { max: -6.0 }               # dBTP — headroom reserved for mastering stage
  stereo.sub.width-pct: { max: 15 }                    # % — looser than master, tightened at master stage
